<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রবেশপত্র - ৪র্থ মেধাবৃত্তি পরীক্ষা ২০২৬ | অভিযাত্রিক সমাজকল্যাণ সংস্থা</title>
    <link href="https://fonts.googleapis.com/css2?family=SolaimanLipi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code & PapaParse for Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #000;
        }

        .search-container {
            max-width: 700px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            border-top: 5px solid #003366;
        }

        .search-container h2 {
            color: #003366;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .search-container p {
            color: #555;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .search-form input {
            padding: 10px 15px;
            width: 65%;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .search-form button {
            padding: 10px 22px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .cards-wrapper {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* প্রবেশপত্র মেইন বক্স */
        .admit-card {
            width: 270mm;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #2e7d32;
            padding: 15px 22px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            page-break-after: always;
        }

        .admit-card::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: url('logo.jpg.jpeg') no-repeat center center;
            background-size: contain;
            opacity: 0.04;
            z-index: 0;
            pointer-events: none;
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .logo-area {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid #2e7d32;
            background: #fff;
        }

        .title-area {
            text-align: center;
            flex-grow: 1;
        }

        .title-area h1 {
            color: #b30000;
            margin: 0;
            font-size: 23px;
            font-weight: bold;
        }

        .title-area p {
            margin: 2px 0;
            font-size: 12px;
            color: #333;
        }

        .title-area h3 {
            color: #003366;
            margin: 2px 0 0 0;
            font-size: 14.5px;
        }

        .badge-title {
            background: #003366;
            color: white;
            padding: 2px 18px;
            display: inline-block;
            border-radius: 3px;
            font-size: 12px;
            margin-top: 3px;
            font-weight: bold;
        }

        .top-right-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .photo-box {
            width: 70px;
            height: 85px;
            border: 1px dashed #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9.5px;
            color: #666;
            background: #fafafa;
            text-align: center;
        }

        .roll-box {
            font-size: 13px;
            font-weight: bold;
        }

        .roll-box span {
            border: 1px solid #ccc;
            padding: 2px 8px;
            background: #fff;
            color: #b30000;
            font-weight: bold;
            margin-left: 4px;
            display: inline-block;
            min-width: 75px;
            text-align: center;
        }

        .info-row {
            margin-bottom: 6px;
            font-size: 13.5px;
            display: flex;
            gap: 15px;
            align-items: baseline;
        }

        .info-item {
            flex-grow: 1;
            white-space: nowrap;
        }

        .info-item span {
            border-bottom: 1px dotted #000;
            display: inline-block;
            font-weight: bold;
            color: #002244;
            font-size: 13.5px;
            line-height: 1.2;
        }

        .exam-center-box {
            border: 1.5px solid #003366;
            background: #f0f4f8;
            border-radius: 4px;
            margin: 6px 0;
            padding: 5px 10px;
            font-size: 13.5px;
            color: #002244;
            font-weight: bold;
        }

        .exam-center-box span {
            color: #000;
            font-weight: bold;
        }

        .schedule-title {
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 3px;
            font-weight: bold;
            font-size: 13px;
            margin-top: 4px;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            margin-bottom: 8px;
        }

        .schedule-table th, .schedule-table td {
            border: 1px solid #2e7d32;
            padding: 5px 8px;
            text-align: left;
        }

        .schedule-table th {
            background: #f1f8f1;
        }

        .rules-section {
            border: 1.2px solid #2e7d32;
            border-radius: 5px;
            padding: 8px 14px;
            background: #fafafa;
            margin-bottom: 10px;
        }

        .rules-title {
            font-size: 13.5px;
            font-weight: bold;
            color: #2e7d32;
            text-align: center;
            margin-bottom: 6px;
            border-bottom: 1px solid #c8e6c9;
            padding-bottom: 3px;
        }

        .rules-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 25px;
            font-size: 12px;
            color: #111;
            line-height: 1.45;
            font-weight: 500;
        }

        /* ফুটার সেকশন (QR, Seal, Signature) */
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 8px;
            padding-top: 5px;
        }

        .qr-verification {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qrcode-box {
            width: 55px;
            height: 55px;
        }

        .qrcode-box img {
            width: 55px !important;
            height: 55px !important;
        }

        .verified-text {
            font-size: 9px;
            line-height: 1.3;
            font-weight: bold;
            color: #003366;
        }

        .seal-box {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
        }

        .seal-box img {
            max-width: 100px;
            max-height: 100px;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .footer-signatures {
            display: flex;
            gap: 25px;
            font-size: 11.5px;
            font-weight: bold;
        }

        .sig-box {
            text-align: center;
            width: 140px;
        }

        .sig-img-container {
            height: 40px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 2px;
        }

        .sig-img-container img {
            max-height: 40px;
            max-width: 120px;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .sig-line {
            border-top: 1px solid #000;
            padding-top: 2px;
        }

        .print-btn-container {
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .print-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'SolaimanLipi', sans-serif;
            font-weight: bold;
        }

        .error-msg {
            color: red;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }
            body {
                background: none;
                padding: 0;
            }
            .search-container, .print-btn-container {
                display: none !important;
            }
            .cards-wrapper {
                gap: 0;
            }
            .admit-card {
                box-shadow: none;
                border: 2px solid #2e7d32 !important;
                margin: 0 auto;
                width: 270mm;
            }
        }
    </style>
</head>
<body>

    <div class="search-container" id="searchSection">
        <h2>প্রবেশপত্র ডাউনলোড (Admit Card)</h2>
        <p>রেজিস্ট্রেশনের সময় প্রদানকৃত আপনার <b>মোবাইল নম্বরটি</b> নিচে লিখে সার্চ করুন:</p>
        <form class="search-form" onsubmit="event.preventDefault(); searchAdmitCard();">
            <input type="text" id="phoneInput" placeholder="মোবাইল নম্বর দিন (যেমন: 017xxxxxxxx)">
            <button type="submit"><i class="fas fa-search"></i> Search</button>
        </form>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="cards-wrapper" id="cardsWrapper"></div>

    <div class="print-btn-container" id="printContainer">
        <button class="print-btn" onclick="window.print()"><i class="fas fa-print"></i> প্রিন্ট বা ডাউনলোড করুন</button>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQF0GPVe74D_NOYumFLo3aJDQZEwU-r_3Q1Lolhq_YD_t92n-TJzIy0iA0YyOkocc5WqeaqWeKD-K0U/pub?gid=0&single=true&output=csv";
        let studentsData = [];
        let isDataLoaded = false;

        window.onload = function() {
            if (SHEET_CSV_URL && SHEET_CSV_URL.startsWith("http")) {
                Papa.parse(SHEET_CSV_URL, {
                    download: true,
                    header: true,
                    complete: function(results) {
                        studentsData = results.data;
                        isDataLoaded = true;
                    },
                    error: function(err) {
                        console.error("CSV Load Error: ", err);
                    }
                });
            }
        };

        function getFieldValue(obj, keyName) {
            for (let key in obj) {
                if (key.trim().toLowerCase() === keyName.toLowerCase()) {
                    let val = obj[key];
                    if (val !== undefined && val !== null) {
                        return val.toString().trim();
                    }
                }
            }
            return "";
        }

        function normalizePhone(phoneStr) {
            if (!phoneStr) return "";
            let clean = phoneStr.replace(/\D/g, "");
            if (clean.length === 10 && clean.startsWith("1")) {
                clean = "0" + clean;
            }
            return clean;
        }

        function searchAdmitCard() {
            const rawPhoneVal = document.getElementById("phoneInput").value.trim();
            const errorMsg = document.getElementById("errorMsg");
            const cardsWrapper = document.getElementById("cardsWrapper");
            const printContainer = document.getElementById("printContainer");

            cardsWrapper.innerHTML = "";
            printContainer.style.display = "none";

            if (!isDataLoaded && studentsData.length === 0) {
                errorMsg.innerText = "সার্ভার থেকে তথ্য লোড হচ্ছে... দয়া করে ৫ সেকেন্ড পর আবার চেষ্টা করুন।";
                errorMsg.style.display = "block";
                return;
            }

            const normalizedInputPhone = normalizePhone(rawPhoneVal);

            if (!normalizedInputPhone) {
                errorMsg.innerText = "দয়া করে একটি সঠিক মোবাইল নম্বর লিখুন।";
                errorMsg.style.display = "block";
                return;
            }

            const matchedStudents = studentsData.filter(s => {
                const sheetPhone = getFieldValue(s, "Mobile");
                return normalizePhone(sheetPhone) === normalizedInputPhone;
            });

            if (matchedStudents.length > 0) {
                const verifiedStudents = matchedStudents.filter(s => {
                    const roll = getFieldValue(s, "Roll");
                    return roll !== "";
                });

                if (verifiedStudents.length === 0) {
                    errorMsg.innerText = "আপনার আবেদনটি পাওয়া গেছে, তবে ফি জমা/ভেরিফিকেশন এখনও সম্পন্ন হয়নি। দয়া করে 01718377229 এই নাম্বারে যোগাযোগ করুন।";
                    errorMsg.style.display = "block";
                    return;
                }

                errorMsg.style.display = "none";

                verifiedStudents.forEach((student, index) => {
                    const name = getFieldValue(student, "Name");       
                    const father = getFieldValue(student, "Father");   
                    const mother = getFieldValue(student, "Mother");   
                    const school = getFieldValue(student, "School");   
                    const cls = getFieldValue(student, "Class");       
                    const roll = getFieldValue(student, "Roll");       
                    let center = getFieldValue(student, "Center");      

                    const displayPhone = normalizedInputPhone;

                    if (!center) {
                        center = "ফতেপুর উচ্চ বিদ্যালয় ও কলেজ, গোয়াইনঘাট, সিলেট।";
                    }

                    let sigSrc = "6.10.png";
                    const cleanCls = cls.toLowerCase();
                    if (cleanCls.includes("৪") || cleanCls.includes("৫") || cleanCls.includes("চতুর্থ") || cleanCls.includes("পঞ্চম") || cleanCls.includes("4") || cleanCls.includes("5") || cleanCls.includes("four") || cleanCls.includes("five")) {
                        sigSrc = "4.5.png";
                    }

                    const qrId = `qrcode_${index}`;

                    const cardHTML = `
                    <div class="admit-card">
                        <div class="card-content">
                            <div class="header-section">
                                <div class="logo-area">
                                    <img src="logo.jpg.jpeg" alt="Logo">
                                </div>
                                <div class="title-area">
                                    <h1>অভিযাত্রিক সমাজকল্যাণ সংস্থা</h1>
                                    <p>ফতেপুর, গোয়াইনঘাট, সিলেট।</p>
                                    <h3>৪র্থ মেধাবৃত্তি পরীক্ষা ২০২৬</h3>
                                    <div class="badge-title">প্রবেশপত্র</div>
                                </div>
                                <div class="top-right-section">
                                    <div class="roll-box">বৃত্তি রোল: <span>${roll || '----'}</span></div>
                                    <div class="photo-box">স্ট্যাম্প সাইজ ছবি</div>
                                </div>
                            </div>

                            <div>
                                <div class="info-row">
                                    <div class="info-item"><strong>শিক্ষার্থীর নাম:</strong> <span style="width: 76%;">${name || '----'}</span></div>
                                    <div class="info-item" style="flex: 0 0 240px;"><strong>মোবাইল:</strong> <span style="width: 150px;">${displayPhone}</span></div>
                                </div>

                                <div class="info-row">
                                    <div class="info-item"><strong>পিতার নাম:</strong> <span style="width: 79%;">${father || '----'}</span></div>
                                    <div class="info-item"><strong>মাতার নাম:</strong> <span style="width: 79%;">${mother || '----'}</span></div>
                                </div>

                                <div class="info-row">
                                    <div class="info-item"><strong>প্রতিষ্ঠানের নাম:</strong> <span style="width: 76%;">${school || '----'}</span></div>
                                    <div class="info-item" style="flex: 0 0 240px;"><strong>শ্রেণি:</strong> <span style="width: 160px;">${cls || '----'}</span></div>
                                </div>
                            </div>

                            <div class="exam-center-box">
                                <i class="fas fa-map-marker-alt"></i> <strong>পরীক্ষা কেন্দ্র:</strong> <span>${center}</span>
                            </div>

                            <div>
                                <div class="schedule-title">পরীক্ষার সময়সূচি</div>
                                <table class="schedule-table">
                                    <tr>
                                        <th style="width: 35%;">তারিখ ও বার</th>
                                        <th style="width: 65%;">সময় ও বিষয়সমূহ</th>
                                    </tr>
                                    <tr>
                                        <td><strong style="color: #000; font-size: 13px;">০৬ নভেম্বর ২০২৬ (শুক্রবার)</strong></td>
                                        <td>
                                            সকাল ১০ঃ৩০ মিনিট থেকে দুপুর ১২ঃ১০ মিনিট পর্যন্ত | <strong>বিষয়সমূহ:</strong> বাংলা, ইংরেজি, গণিত, বিজ্ঞান, সাধারণ জ্ঞান
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <div class="rules-section">
                                <div class="rules-title">পরীক্ষা সংক্রান্ত জরুরি নিয়মাবলি</div>
                                <div class="rules-grid">
                                    <div>১. পরীক্ষার ৩০ মিনিট পূর্বে কেন্দ্রে উপস্থিত হতে হবে।</div>
                                    <div>৭. উত্তর সংশোধনে ঘষামাজা বা ফুইড ব্যবহার নিষেধ।</div>
                                    <div>২. প্রবেশপত্র সঙ্গে আনা বাধ্যতামূলক।</div>
                                    <div>৮. উত্তরপত্রে অতিরিক্ত কোনো দাগ বা লেখা যাবে না।</div>
                                    <div>৩. মোবাইল, স্মার্টওয়াচ বা কোনো অননুমোদিত সামগ্রী নিষিদ্ধ।</div>
                                    <div>৯. উত্তরপত্রে উত্তর দেওয়া আবশ্যক।</div>
                                    <div>৪. মানবণ্টন অনুযায়ী পরীক্ষা MCQ পদ্ধতিতে হবে।</div>
                                    <div>১০. অসদুপায় অবলম্বন ও কথা বলা সম্পূর্ণ নিষিদ্ধ।</div>
                                    <div>৫. উত্তরপত্রের বৃত্ত কালো বলপেন দিয়ে ভরাট করতে হবে।</div>
                                    <div>১১. পরীক্ষা শেষে খাতা জমা দিয়ে হল ত্যাগ করতে হবে।</div>
                                    <div>৬. একটি প্রশ্নে একাধিক বৃত্ত পূরণ করা যাবে না।</div>
                                </div>
                            </div>

                            <div class="footer-section">
                                <div class="qr-verification">
                                    <div class="qrcode-box" id="${qrId}"></div>
                                    <div class="verified-text">
                                        <span style="color: #2e7d32; font-weight: bold;"><i class="fas fa-check-circle"></i> VERIFIED</span><br>
                                        অভিযাত্রিক সমাজকল্যাণ সংস্থা<br>
                                        <span style="font-size: 8px; color: #555;">স্ক্যান করে সত্যতা যাচাই করুন</span>
                                    </div>
                                    <div class="seal-box">
                                        <img src="seal1.png.png" alt="Seal" onerror="this.style.display='none'">
                                    </div>
                                </div>

                                <div class="footer-signatures">
                                    <div class="sig-box">
                                        <div class="sig-img-container">
                                            <img src="${sigSrc}" alt="Signature">
                                        </div>
                                        <div class="sig-line">পরীক্ষা নিয়ন্ত্রক</div>
                                    </div>
                                    <div class="sig-box">
                                        <div class="sig-img-container"></div>
                                        <div class="sig-line">শিক্ষার্থীর স্বাক্ষর</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;

                    cardsWrapper.insertAdjacentHTML('beforeend', cardHTML);

                    new QRCode(document.getElementById(qrId), {
                        text: "https://abhijatrik-org.github.io/abhijatrik-website/admit.html",
                        width: 55,
                        height: 55,
                        colorDark : "#003366",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                });

                printContainer.style.display = "block";
            } else {
                errorMsg.innerText = "দুঃখিত! এই মোবাইল নম্বর দিয়ে কোনো নিবন্ধিত প্রবেশপত্র পাওয়া যায়নি।";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
